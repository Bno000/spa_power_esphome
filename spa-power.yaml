# Read-only Spa Power SP800/SP1200 keypad bus monitor.
# Put the "components" folder next to this file.

esphome:
  name: spa-power
  on_boot:

esp32:
  board: esp32-s3-devkitc-1      # change to your board
  framework:
    type: esp-idf

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

api:
ota:
  - platform: esphome

# On an ESP32-S3 with native USB, keep the logger off the pins used below.
logger:
  hardware_uart: USB_SERIAL_JTAG
  level: DEBUG

external_components:
  - source:
      type: git
      url: https://github.com/Bno000/spa_power_esphome
    refresh: 0s



uart:
  id: spa_uart
  rx_pin: GPIO20
  tx_pin: GPIO21 # change to the pin wired to the transceiver's RO
  baud_rate: 19200
  data_bits: 8
  parity: NONE
  stop_bits: 1
  rx_buffer_size: 1024
  flow_control_pin: GPIO0

spa_power:
  id: spa
  uart_id: spa_uart
  # Sending is off unless transmit is true. While dry_run is true the controls only log the key frames they
  # would send. Check the log first, then set dry_run: false to send for real.
  transmit: true
  dry_run: false
  # Optional timing (defaults shown):
  # key_hold: 150ms              # time between key-down and the release frame
  # response_timeout: 800ms      # how long to wait for the status frame to change after a press
  # max_reply_latency: 1500us    # only send in the reply slot if the loop was at least this fast
  # key_spacing: 400ms           # minimum time between key presses

sensor:
  - platform: spa_power
    spa_power_id: spa
    current_temperature:
      name: "Spa Current Temperature"
    set_temperature:
      name: "Spa Set Temperature"
    light_level:
      name: "Spa Light Level"
 
binary_sensor:
  - platform: spa_power
    spa_power_id: spa
    pump_running:
      name: "Spa Pump Running"
    heater:
      name: "Spa Heater"
    ozone:
      name: "Spa Ozone"
    pump2_running:
      name: "Spa Pump 2 Running"
    aux:
      name: "Spa Aux"
 
text_sensor:
  - platform: spa_power
    spa_power_id: spa
    line1:
      name: "Spa Display Line 1"
    line2:
      name: "Spa Display Line 2"
    key:
      name: "Spa Last Key"
    pump_state:
      name: "Spa Pump"
    light_color:
      name: "Spa Light Colour (experimental)"
    big_digits:
      name: "Spa Big Digits"
    status_raw:
      name: "Spa Status Raw"
      entity_category: diagnostic
 
# Controls. The state shown is always what the controller reports, not what was commanded.
select:
  - platform: spa_power
    spa_power_id: spa
    pump:
      name: "Spa Pump Mode"      # off / auto / on
 
switch:
  - platform: spa_power
    spa_power_id: spa
    pump2:
      name: "Spa Pump 2"
    aux:
      name: "Spa Aux"
 
# Single key presses. up, down and select are the keypad's navigation keys: they work on any screen and do what the
# controller's current screen says. To change the setpoint: select, up, select, then up or down (0.25 C each),
# then select. Quick taps are queued (up to 16) and spaced out by key_spacing.
button:
  - platform: spa_power
    spa_power_id: spa
    up:
      name: "Spa Up"
    down:
      name: "Spa Down"
    select:
      name: "Spa Select"
    pump:
      name: "Spa Pump Key"
    pump2:
      name: "Spa Pump 2 Key"
    aux:
      name: "Spa Aux Key"
 
